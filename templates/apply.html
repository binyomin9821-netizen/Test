<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apartment Application</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <h1>Apartment Application</h1>
    <p class="subtitle">Please fill out the form below to apply.</p>

    {% if errors %}
      <div class="errors">
        <ul style="margin:0; padding-left:18px;">
          {% for error in errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
      </div>
    {% endif %}

    <form class="card" method="post" action="{{ url_for('apply') }}">
      <fieldset>
        <legend>Which property are you applying to?</legend>
        <label for="property_id">Property</label>
        <select id="property_id" name="property_id" required>
          <option value="" disabled {% if not form.get('property_id') %}selected{% endif %}>Select a property...</option>
          {% for property in properties %}
            <option value="{{ property.id }}" {% if form.get('property_id')|string == property.id|string %}selected{% endif %}>
              {{ property.name }} - {{ property.address }}
            </option>
          {% endfor %}
        </select>
      </fieldset>

      <fieldset>
        <legend>Part 1: Basic Information</legend>

        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ form.get('full_name', '') }}" required>

        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" value="{{ form.get('phone', '') }}" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" required>

        <label for="current_address">Current Address</label>
        <input type="text" id="current_address" name="current_address" value="{{ form.get('current_address', '') }}" required>
      </fieldset>

      <fieldset>
        <legend>Part 2: Household Information</legend>

        <label for="marital_status">Marital Status</label>
        <select id="marital_status" name="marital_status">
          <option value="" {% if not form.get('marital_status') %}selected{% endif %}>Prefer not to say</option>
          <option value="Single" {% if form.get('marital_status') == 'Single' %}selected{% endif %}>Single</option>
          <option value="Married" {% if form.get('marital_status') == 'Married' %}selected{% endif %}>Married</option>
          <option value="Divorced" {% if form.get('marital_status') == 'Divorced' %}selected{% endif %}>Divorced</option>
          <option value="Widowed" {% if form.get('marital_status') == 'Widowed' %}selected{% endif %}>Widowed</option>
        </select>

        <label for="number_of_children">Number of Children</label>
        <input type="number" id="number_of_children" name="number_of_children" min="0" step="1" value="{{ form.get('number_of_children', '') }}">
      </fieldset>

      <button type="submit">Submit Application</button>
    </form>
  </div>
</body>
</html>
