<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scheduled Inspections</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="top-bar">
    <span></span>
    <a href="{{ url_for('inspector_logout') }}">Log out</a>
  </div>
  <div class="page wide">
    <h1>Scheduled Inspections</h1>
    <p class="subtitle">Every application with a booked inspection time.</p>

    <table>
      <thead>
        <tr>
          <th>Date &amp; Time</th>
          <th>Applicant</th>
          <th>Property</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {% for i in inspections %}
          <tr onclick="window.location='{{ url_for('inspector_application_detail', application_id=i.application_id) }}'" style="cursor:pointer;">
            <td>{{ i.slot_time }}</td>
            <td><a href="{{ url_for('inspector_application_detail', application_id=i.application_id) }}">{{ i.full_name }}</a></td>
            <td>{{ i.property_name }}</td>
            <td>
              <span class="status {{ 'approved' if i.inspection_status == 'Completed' else 'pending' }}">
                {{ i.inspection_status or 'Scheduled' }}
              </span>
            </td>
          </tr>
        {% else %}
          <tr><td colspan="4">No inspections scheduled yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
